{% load bootstrap_icons %}
{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url "main:home" %}"><img src="{% static '/img/logo.png' %}" style="width: 38px" alt="logo"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse d-flex flex-row-reverse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" aria-current="page" href="{% url "main:home" %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="{% url "main:about" %}">About</a>
        </li>
        <li class="nav-item dropdown" data-bs-theme="dark">
          <a class="nav-link dropdown-toggle {% if request.path == '/solo_albums' or request.path == '/film_music' %}active{% endif %}" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Music
          </a>
          <ul class="dropdown-menu dropdowm-menu-dark">
            <li><a class="dropdown-item" href="{% url "main:solo_albums" %}">Solo albums</a></li>
            <li><a class="dropdown-item" href="{% url "main:film_music" %}">Film music</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="{% url "main:contact" %}">Contact</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url "main:basket" %}">
            <span style="position: relative; top: 3px;">{% bs_icon "bag-fill" %}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
