{% extends "main/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
  <div class="container">
      CONTACT

      {% if sent %}
          <h3>You have sent follow message:</h3>
          <p>{{ form.cleaned_data.message }}</p>
      {% else %}
          <form method="POST">
              {% csrf_token %}
              {% bootstrap_form form %}
              <input type="submit" value="SUBMIT">
          </form>
      {% endif %}
  </div>
{% endblock %}
